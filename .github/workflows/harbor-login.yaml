name: Build And Push Image On Harbor 

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'branch name'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: docker/login-action@v1
      with:
        registry: harbor.fintechsys.net
        username: ${{ secrets.HARBOR_USERNAME  }}
        password: ${{ secrets.HARBOR_PASSWORD }}
        
    - name: build image
      run: |
        git clone  --branch ${{ inputs.branch_name }} https://${{ secrets.ORG2_TOKEN }}@github.com/fintechsys/fineract.git
        cd fineract
        ./gradlew --no-daemon --console=plain :fineract-provider:jibDockerBuild -x test -x cucumber

    - name: push image to harbor
      run: |
         docker tag fineract:latest harbor.fintechsys.net/core-bank/fineract/${{ inputs.branch_name }}:latest
         docker push harbor.fintechsys.net/core-bank/fineract/${{ inputs.branch_name }}:latest
