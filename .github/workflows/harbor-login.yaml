name: Build And Push Image On Harbor 

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'branch name'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: docker/login-action@v1
      with:
        registry: harbor.fintechsys.net
        username: ${{ secrets.HARBOR_USERNAME  }}
        password: ${{ secrets.HARBOR_PASSWORD }}
        
    - name: build image
      run: |
        git clone  --branch ${{ inputs.branch_name }} https://${{ secrets.ORG_TOKEN }}@github.com/fintechsys/web-app.git
        cd web-app
        docker build -t web-app:latest .
         
    - name: push image to harbor
      run: |
        docker tag web-app:latest harbor.fintechsys.net/core-bank/web-app/${{ inputs.branch_name }}:latest
        docker push harbor.fintechsys.net/core-bank/web-app/${{ inputs.branch_name }}:latest
